<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ajGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8FF00"/>
      <stop offset="100%" stop-color="#DFFF18"/>
    </linearGradient>
  </defs>
  <!-- Background canvas -->
  <rect width="64" height="64" rx="16" fill="#1E1E22"/>
  <!-- Border outline -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#C8FF00" stroke-width="2.5" stroke-opacity="0.35"/>
  <!-- Typographic Monogram AJ -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="900" letter-spacing="-1.2" fill="url(#ajGrad)" text-anchor="middle">AJ</text>
  <!-- Bottom Accent Bar -->
  <rect x="18" y="50" width="28" height="3.5" rx="1.75" fill="#C8FF00"/>
</svg>
